[package]
name = "stac-hash"
version.workspace = true
edition = "2024"
rust-version = "1.85"
authors = ["Pete Gadomski <pete.gadomski@gmail.com>"]
description = "Sortable spatio-temporal hashes for STAC items"
documentation = "https://docs.rs/stac-hash"
repository = "https://github.com/gadomski/stac-hash"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["stac", "geospatial", "spatiotemporal", "hash", "morton"]
categories = ["science::geo", "algorithms", "data-structures"]
exclude = [
    "/.github",
    "/.gitignore",
    "/.python-version",
    "/docs",
    "/mkdocs.yml",
    "/pyproject.toml",
    "/python",
    "/release-plz.toml",
    "/tests",
    "/uv.lock",
]

[dependencies]
chrono = "0.4.45"
thiserror = "2.0.19"

[dev-dependencies]
rstest = "0.26.1"

[workspace]
members = ["python"]
default-members = ["."]

[workspace.package]
version = "0.0.1"
